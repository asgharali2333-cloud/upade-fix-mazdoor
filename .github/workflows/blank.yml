name: Build EarningDashboard APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract Android project
        run: |
          unzip -q "EarningDashboard-Browser-Upgrade-v1.zip" -d extracted

      - name: Build Debug APK
        working-directory: extracted/ed
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarningDashboard-debug
          path: 'extracted/ed/**/build/outputs/apk/debug/*.apk'
